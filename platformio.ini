; ESP32-S3-WROOM-1-N16R8 + 2.8" SPI LCD
; 接线: GND 3V3 | SDA->11 SCL->12 CS->5 DC->2 RES->4 BLK->GPIO15（低功耗可控）
; 已弃用 TFT_eSPI（ESP32-S3 上 REG_SPI_BASE(FSPI=0)=0 导致 StoreProhibited@0x10）

[platformio]
default_envs = esp32-s3-st7789

[env]
platform = espressif32@7.0.1
; The installed DevKitC definition is N8/no-PSRAM. This module is S3-R8N16.
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_port = COM20
monitor_port = COM20
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ignore = ESP32-A2DP
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=12288
    -Iinclude

; ---- 2.8" ST7789（Adafruit，无 TFT_eSPI 寄存器 bug）----
[env:esp32-s3-st7789]
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
build_flags =
    ${env.build_flags}
    -DDISP_DRIVER_ST7789=1

; ---- 备用：2.8" 实为 ILI9341 ----
[env:esp32-s3-ili9341]
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/Adafruit BusIO
build_flags =
    ${env.build_flags}
    -DDISP_DRIVER_ILI9341=1
