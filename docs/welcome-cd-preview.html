<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>待机页 · 时分秒翻页时钟</title>
<style>
  * { box-sizing: border-box; }
  body { background:#0a0a0c; color:#eee; font-family:system-ui,sans-serif; padding:32px; }
  h1 { font-size:18px; font-weight:600; text-align:center; margin-bottom:6px; }
  .sub { color:#889; font-size:13px; text-align:center; margin-bottom:20px; }
  .screen {
    width:320px; height:240px; margin:0 auto; background:#000; border-radius:8px;
    box-shadow:0 16px 48px #000a; overflow:hidden; position:relative;
    border:1px solid #333;
  }
  .bar {
    height:28px; background:#1a1f26; display:flex; align-items:center;
    justify-content:space-between; padding:0 8px; font-size:11px;
    border-bottom:1px solid #333;
  }
  .bar .t { font-size:14px; font-weight:600; letter-spacing:1px; }
  .batt {
    width:36px; height:14px; border:1px solid #fff; font-size:9px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(90deg,#30d158 82%,#1a1f26 82%); position:relative;
  }
  .batt:after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:8px; background:#fff; }

  /* 垂直居中的时分秒块 */
  .clock-block {
    position:absolute; left:0; right:0; top:28px; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
  }
  .flip-row {
    display:flex; align-items:center; justify-content:center; gap:0;
  }
  .pair { display:flex; gap:3px; }
  .colon {
    width:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  .colon i {
    width:4px; height:4px; border-radius:1px; background:#fff; display:block;
    box-shadow: 0 0 1px #0006;
  }
  .card {
    width:44px; height:96px; border-radius:6px;
    background: linear-gradient(180deg, #3A4E68 0 50%, #2A3A52 50% 100%);
    position:relative; overflow:hidden;
    box-shadow: 0 0 0 1px #1a2838, inset 1px 0 0 #1a2838, inset -1px 0 0 #1a2838;
  }
  .card .digit {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:46px; font-weight:800;
    font-family: "Arial Black", Arial, sans-serif;
    letter-spacing:-1px; line-height:1;
  }
  .card .seam {
    position:absolute; left:2px; right:2px; top:50%; height:1px;
    background:#a0a8b0; z-index:2;
    box-shadow: 0 -1px 0 #000;
  }
  .labels {
    display:flex; width:298px; justify-content:space-between; padding:0 2px;
  }
  .labels span {
    width:91px; text-align:center; font-size:10px; color:#777;
    letter-spacing:2px; text-transform:uppercase;
  }

  ul { margin:24px auto 0; color:#9ab; font-size:13px; line-height:1.7; max-width:420px; }
  code { background:#222; padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>
  <h1>待机页 · 时分秒翻页</h1>
  <p class="sub">底部波形已去掉 · 中部垂直居中 · HR : MIN : SEC</p>

  <div class="screen">
    <div class="bar">
      <span class="t">12:30</span>
      <span style="opacity:.9;font-size:10px">Standby</span>
      <div class="batt">82%</div>
    </div>
    <div class="clock-block">
      <div class="flip-row">
        <div class="pair">
          <div class="card"><div class="digit" data-i="0">1</div><div class="seam"></div></div>
          <div class="card"><div class="digit" data-i="1">2</div><div class="seam"></div></div>
        </div>
        <div class="colon"><i></i><i></i></div>
        <div class="pair">
          <div class="card"><div class="digit" data-i="2">3</div><div class="seam"></div></div>
          <div class="card"><div class="digit" data-i="3">0</div><div class="seam"></div></div>
        </div>
        <div class="colon"><i></i><i></i></div>
        <div class="pair">
          <div class="card"><div class="digit" data-i="4">4</div><div class="seam"></div></div>
          <div class="card"><div class="digit" data-i="5">5</div><div class="seam"></div></div>
        </div>
      </div>
      <div class="labels">
        <span>HR</span><span>MIN</span><span>SEC</span>
      </div>
    </div>
  </div>

  <ul>
    <li>布局：<code>[时][时] : [分][分] : [秒][秒]</code></li>
    <li>组内密贴 3px，组间冒号分隔</li>
    <li>深蓝翻页卡 + 大白字 + 中部细灰线</li>
    <li>下方标签 HR / MIN / SEC</li>
    <li>无底部波形，时钟在状态栏下垂直居中</li>
  </ul>
  <script>
    let t = new Date(); t.setHours(12, 30, 45, 0);
    const digits = [...document.querySelectorAll('.digit')];
    const pad = n => String(n).padStart(2, '0');
    function paint() {
      const s = pad(t.getHours()) + pad(t.getMinutes()) + pad(t.getSeconds());
      digits.forEach((el, i) => { el.textContent = s[i]; });
    }
    paint();
    setInterval(() => { t = new Date(t.getTime() + 1000); paint(); }, 1000);
  </script>
</body>
</html>
